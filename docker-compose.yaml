services:
  mc:
    image: itzg/minecraft-server
    container_name: minecraft-technical-smp
    tty: true
    stdin_open: true
    restart: unless-stopped

    ports:
      - "25565:25565"
      - "19132:19132/udp"
      - "25575:25575"

    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "LATEST"
      MEMORY: "8G"

      USE_AIKAR_FLAGS: "true"

      ENABLE_AUTOPAUSE: "false"
      # AUTOPAUSE_TIMEOUT_EST: 600

      FIX_OWNERSHIP: "true"

      MODS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/fabric

      # https://cdn.modrinth.com/data/YlKdE5VK/versions/j78qte9T/ViaFabric-0.4.21%2B138-1.14-1.21.jar

      MODRINTH_PROJECTS: "fabric-api, lithium, ferrite-core, krypton, floodgate, squaremap, chunky, tab-was-taken, placeholder-api, player-drops-head, player-graves, fastback"
      # (yet to find)drivebackupv2, viafabric
      # viaversion, viabackwards,
      # PAPI_DOWNLOAD_EXPANSIONS: "Player"

      # Copy custom configs from /config to /data on startup
      COPY_CONFIG_DEST: /data

      # Server.properties configuration via environment variables
      DIFFICULTY: "normal"
      MODE: "survival"
      MOTD: "itzmaniss Minecraft Server"
      MAX_PLAYERS: 20
      VIEW_DISTANCE: 16
      SIMULATION_DISTANCE: 12
      ALLOW_FLIGHT: "false"
      ONLINE_MODE: "true"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "password"
      RCON_PORT: 25575
      SPAWN_PROTECTION: 16
      MAX_WORLD_SIZE: 29999984
      GENERATE_STRUCTURES: "true"
      LEVEL_TYPE: "minecraft:normal"
      HARDCORE: "false"
      FORCE_GAMEMODE: "false"
      GAMEMODE: "survival"

    volumes:
      - ${MC_DATA_PATH}:/data
      # ---- GITOPS CONFIG MOUNT ----
      # Mount entire config directory - files will be copied to /data on startup
      - ./config:/config:ro
